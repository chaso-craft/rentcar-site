<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>見積書・領収書 | 店舗管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260909e">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="./admin.html" class="logo">
        <span class="logo-mark" aria-hidden="true">G</span>
        <span class="logo-copy">
          <span class="logo-text">見積書・領収書</span>
          <span class="logo-sub">店舗管理</span>
        </span>
      </a>
        <button type="button" class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="siteNav">
        <a href="./admin.html">予約管理へ</a>
        <a href="./index.html">予約サイトへ</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>見積書・領収書の検索</h2>
      <p class="hint-text">予約者名・電話番号・メールアドレスのいずれかで、過去の見積書・領収書を検索できます。</p>

      <form id="documentSearchForm" class="document-search-form">
        <label class="document-search-field">
          検索キーワード
          <input type="search" id="documentSearchInput" placeholder="名前・電話番号・メールアドレス" autocomplete="off">
        </label>
        <label class="document-search-field">
          種類
          <select id="documentTypeFilter">
            <option value="all">すべて</option>
            <option value="estimate">見積書のみ</option>
            <option value="receipt">領収書のみ</option>
          </select>
        </label>
        <button type="submit">検索</button>
        <button type="button" id="documentSearchReset" class="secondary">クリア</button>
      </form>

      <p id="documentSearchSummary" class="document-search-summary"></p>
    </section>

    <section class="card">
      <h2>検索結果</h2>
      <div class="table-scroll">
        <table class="document-results-table">
          <thead>
            <tr>
              <th>種類</th>
              <th>番号</th>
              <th>発行日</th>
              <th>お名前</th>
              <th>電話番号</th>
              <th>メール</th>
              <th>車種</th>
              <th>合計</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="documentResultsBody"></tbody>
        </table>
      </div>
      <p id="documentEmptyMessage" class="hint-text" hidden>該当する書類はありません。</p>
    </section>
  </main>

  <div id="documentViewModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-doc-modal></div>
    <div class="modal-panel document-modal-panel" role="dialog" aria-modal="true" aria-labelledby="documentModalTitle">
      <div class="modal-header document-modal-header">
        <h3 id="documentModalTitle" class="modal-title">書類の詳細</h3>
        <div class="document-modal-actions">
          <button type="button" id="documentPrintBtn" class="secondary">印刷</button>
          <button type="button" class="modal-close" data-close-doc-modal aria-label="閉じる">×</button>
        </div>
      </div>
      <div id="documentModalBody" class="modal-body document-modal-body"></div>
      <div class="modal-footer">
        <button type="button" data-close-doc-modal>閉じる</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./shared.js"></script>
  <script src="./supabase-data.js"></script>
  <script src="./site-ui.js"></script>
  <script src="./admin-documents.js"></script>
</body>
</html>
